<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Une surprise...</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050507;color:#eee;font-family:Arial,sans-serif;display:grid;place-items:center;overflow:hidden}
.wrap{text-align:center;padding:24px;width:min(700px,92vw)}
.small{color:#777;letter-spacing:3px;text-transform:uppercase;font-size:12px}
h1{font-size:clamp(28px,7vw,58px);margin:18px 0 8px}
#gift{font-size:100px;background:none;border:0;cursor:pointer;filter:drop-shadow(0 0 18px #5b1b78);transition:.25s}
#gift:hover{transform:scale(1.08)}
button{color:white}
.hidden{display:none}
#reveal{animation:fade 1.2s ease}
.title{font-size:clamp(42px,10vw,82px);font-weight:900;letter-spacing:6px;color:#b96be8;text-shadow:0 0 22px #6d168e}
p{color:#aaa;font-size:18px}
a{display:inline-block;margin-top:20px;padding:15px 24px;border-radius:12px;background:#8c36b4;color:white;text-decoration:none;font-weight:800}
@keyframes fade{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.glitch{animation:glitch .12s infinite alternate}
@keyframes glitch{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
</style>
</head>
<body>
<main class="wrap">
  <div class="small">Un cadeau t'attend</div>
  <h1 id="message">J'ai quelque chose pour toi...</h1>
  <button id="gift" aria-label="Ouvrir le cadeau">🎁</button>
  <div id="reveal" class="hidden">
    <div class="small">La surprise est révélée</div>
    <div class="title">LOVECRAFT</div>
    <p>Tu pensais vraiment repartir les mains vides ? 👁️</p>
    <p>Ton cadeau t'attend sur Steam.</p>
    <a href="https://store.steampowered.com/search/?term=LoveCraft" target="_blank" rel="noopener">🎮 Récupérer le jeu</a>
  </div>
</main>
<script>
const gift=document.getElementById('gift'), msg=document.getElementById('message'), reveal=document.getElementById('reveal');
function openGift(){
  gift.classList.add('hidden');
  msg.classList.add('glitch');
  msg.textContent='...';
  setTimeout(()=>{msg.classList.remove('glitch');msg.classList.add('hidden');reveal.classList.remove('hidden')},900);
}
gift.addEventListener('click',openGift);
</script>
</body>
</html>
